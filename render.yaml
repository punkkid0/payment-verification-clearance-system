services:
  - type: web
    name: unicross-clearance
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && REACT_APP_API_URL=/api npm run build --prefix frontend
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: unicross-db
          property: connectionString

databases:
  - name: unicross-db
    plan: free
